name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (FastAPI · Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check backend exists
        id: check
        working-directory: .
        run: |
          if [ -f backend/requirements.txt ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "backend/ 없음 → 건너뜀"
          fi

      - name: Set up Python
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies (torch 등 GPU 의존은 받지 않음)
        if: steps.check.outputs.exists == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install rapidfuzz==3.14.6 fastapi==0.142.2 starlette==1.7.0 httpx==0.28.1 yt-dlp==2026.8.19 "psycopg[binary]==3.3.9"
          pip install ruff pytest

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        run: ruff check .

      - name: PostgreSQL on PATH (preinstalled on runner, service stays off)
        if: steps.check.outputs.exists == 'true'
        run: |
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
          "$(pg_config --bindir)/initdb" --version
          "$(pg_config --bindir)/pg_ctl" --version

      - name: Test (GPU 필요한 테스트 제외)
        if: steps.check.outputs.exists == 'true'
        run: pytest -q -m "not gpu" || [ $? -eq 5 ]

  frontend:
    name: Frontend (React · Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check frontend exists
        id: check
        working-directory: .
        run: |
          if [ -f frontend/package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "frontend/ 없음 → 건너뜀"
          fi

      - name: Set up Node
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: npm ci

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        run: npm run lint --if-present

      - name: Build
        if: steps.check.outputs.exists == 'true'
        run: npm run build
